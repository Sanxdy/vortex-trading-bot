profiles:
  sideway:
    grid:
      type: arithmetic
      default_width_percent: 0.6
      default_count: 5
      default_equity_percent_per_level: 1.0
      profile_max_levels: 5
    strategy:
      entry:
        timeframe: 15m
        ema_period: 200
        bb_threshold: 0.001
      regime:
        adx_period: 14
        adx_trend_threshold: 20
        atr_vol_spike: 2.0
      trend:
        allow_breakout: false
        allow_short: true
        allow_long: true
        short_rsi_threshold: 40
        short_min_adx: 15
        short_signal_adx: 20
        short_breakout_adx: 18
        short_mr_rsi_threshold: 65
        ema_fast: 20
        ema_slow: 50
        rsi_oversold: 40
        rsi_overbought: 60
        risk_percent: 3.0
        tp_atr: 3.0
        trail_atr: 1.0
        profit_lock_pct: 0.30
        profit_lock_trail: 0.15
      exit:
        stop_loss:
          atr_multiplier: 3.0
      breakeven_pct: 0.30
    risk:
      slippage_max_percent: 0.05
      min_net_profit_percent: 0.25

  trend_only:
    grid:
      enabled: false
    strategy:
      entry:
        timeframe: 15m
        ema_period: 200
        bb_threshold: 0.001
      regime:
        adx_period: 14
        adx_trend_threshold: 20
        atr_vol_spike: 2.0
      trend:
        allow_breakout: false
        allow_short: true
        allow_long: true
        short_rsi_threshold: 40
        short_min_adx: 15
        short_signal_adx: 20
        short_breakout_adx: 18
        short_mr_rsi_threshold: 65
        ema_fast: 20
        ema_slow: 50
        rsi_oversold: 40
        rsi_overbought: 60
        risk_percent: 2.0
        tp_atr: 2.5
        trail_atr: 1.0
        profit_lock_pct: 0.30
        profit_lock_trail: 0.15
      exit:
        stop_loss:
          atr_multiplier: 3.0
      breakeven_pct: 0.30
    risk:
      slippage_max_percent: 0.05
      min_net_profit_percent: 0.25

  scalper:
    grid:
      enabled: false
    strategy:
      entry:
        timeframe: 5m
        ema_period: 50
        bb_threshold: 0.005
      regime:
        adx_period: 14
        adx_trend_threshold: 30
        atr_vol_spike: 2.0
      trend:
        allow_breakout: true
        allow_short: true
        allow_long: true
        short_rsi_threshold: 40
        short_min_adx: 15
        short_signal_adx: 20
        short_breakout_adx: 18
        short_mr_rsi_threshold: 65
        ema_fast: 20
        ema_slow: 50
        rsi_oversold: 40
        rsi_overbought: 60
        risk_percent: 1.5
        tp_atr: 2.0
        trail_atr: 1.0
        profit_lock_pct: 0.30
        profit_lock_trail: 0.15
      exit:
        stop_loss:
          atr_multiplier: 3.0
      breakeven_pct: 0.18
    risk:
      slippage_max_percent: 0.05
      min_net_profit_percent: 0.25

  conservative:
    grid:
      type: geometric
      default_width_percent: 2.0
      default_count: 8
      default_equity_percent_per_level: 0.5
      profile_max_levels: 15
    strategy:
      entry:
        timeframe: 15m
        ema_period: 200
        bb_threshold: 0.001
      regime:
        adx_period: 14
        adx_trend_threshold: 20
        atr_vol_spike: 2.0
      trend:
        allow_breakout: false
        allow_short: true
        allow_long: true
        short_rsi_threshold: 40
        short_min_adx: 15
        short_signal_adx: 20
        short_breakout_adx: 18
        short_mr_rsi_threshold: 65
        ema_fast: 20
        ema_slow: 50
        rsi_oversold: 35
        rsi_overbought: 65
        risk_percent: 1.0
        tp_atr: 3.0
        trail_atr: 1.0
        profit_lock_pct: 0.30
        profit_lock_trail: 0.15
      exit:
        stop_loss:
          atr_multiplier: 3.0
      breakeven_pct: 0.20
    risk:
      slippage_max_percent: 0.05
      min_net_profit_percent: 0.25

  standard:
    grid:
      type: geometric
      default_width_percent: 1.5
      default_count: 8
      default_equity_percent_per_level: 2.0
      profile_max_levels: 20
    strategy:
      entry:
        timeframe: 15m
        ema_period: 200
        bb_threshold: 0.001
      regime:
        adx_period: 14
        adx_trend_threshold: 20
        atr_vol_spike: 2.0
      trend:
        allow_breakout: true
        allow_short: true
        allow_long: true
        short_rsi_threshold: 40
        short_min_adx: 15
        short_signal_adx: 20
        short_breakout_adx: 18
        short_mr_rsi_threshold: 65
        ema_fast: 20
        ema_slow: 50
        rsi_oversold: 40
        rsi_overbought: 60
        risk_percent: 2.0
        tp_atr: 3.0
        trail_atr: 1.0
        profit_lock_pct: 0.30
        profit_lock_trail: 0.15
      exit:
        stop_loss:
          atr_multiplier: 3.0
      breakeven_pct: 0.20
    risk:
      slippage_max_percent: 0.05
      min_net_profit_percent: 0.25

auto_profile:
  enabled: true
  interval_seconds: 1800
  min_hold_seconds: 7200
  switch_only_when_flat: true

min_price: 0.0001
ai:
  confidence_threshold: 0.3

fees:
  maker: 0.0002
  taker: 0.0004

futures:
  leverage: 5
  margin_mode: isolated
  budget_per_slot: 20
  max_slots: 3

redis_prefix: vortex:futures
active_profile: sideway

exchange:
  name: binanceusdm
  api_key: ''
  api_secret: ''
  testnet: true
  rate_limit:
    max_requests: 1200
    interval: 60

grid:
  enabled: true
  default_width_percent: 0.6
  default_count: 5
  default_equity_percent_per_level: 1.0

allocator:
  reserve_pct: 0.2
  min_per_slot: 20
  max_budget_pct: 0.6

execution:
  post_only_trend: true
  post_only_grid: true
  force_market_entries: false
  cancel_bot_orders_on_start: true
  sweep_on_start: false
  timeout:
    continuation: 180
    breakout: 300
    countertrend: 600
    sideway: 120

anti_churn:
  continuation:
    max_consecutive_losses: 2
    cooldown_minutes: 45

entry_paths: {}

redis:
  host: redis
  port: 6379
  password: ''
  db: 0

timescaledb:
  host: timescaledb
  port: 5432
  dbname: vortex_trades
  user: vortex
  password: vortex_password
  schema: "CREATE TABLE IF NOT EXISTS trades (\n  id SERIAL,\n  timestamp TIMESTAMPTZ NOT NULL,\n  pair TEXT NOT NULL,\n  side TEXT NOT NULL,\n  price NUMERIC(16,8) NOT NULL,\n  quantity NUMERIC(16,8) NOT NULL,\n  order_id TEXT,\n  status TEXT NOT NULL,\n  grid_level INTEGER,\n  realized_pnl NUMERIC(16,8),\n  fee_cost NUMERIC(16,8),\n  exchange TEXT DEFAULT 'futures'\n);\nALTER TABLE trades ADD COLUMN IF NOT EXISTS fee_cost NUMERIC(16,8);\nALTER TABLE trades ADD COLUMN IF NOT EXISTS exchange TEXT DEFAULT 'futures';\nALTER TABLE trades DROP CONSTRAINT IF EXISTS trades_pkey;\nALTER TABLE trades DROP CONSTRAINT IF EXISTS trades_order_id_key;\nALTER TABLE trades ADD CONSTRAINT trades_pkey PRIMARY KEY (timestamp, id);\nCREATE UNIQUE INDEX IF NOT EXISTS trades_timestamp_order_id_key ON trades (timestamp, order_id) WHERE order_id IS NOT NULL;\nSELECT create_hypertable('trades', 'timestamp', if_not_exists => TRUE);\n\nCREATE TABLE IF NOT EXISTS balance_snapshots (\n  id SERIAL,\n  timestamp TIMESTAMPTZ NOT NULL,\n  usdt_balance NUMERIC(16,8),\n  total_value NUMERIC(16,8),\n  exchange TEXT DEFAULT 'futures'\n);\nALTER TABLE balance_snapshots ADD COLUMN IF NOT EXISTS exchange TEXT DEFAULT 'futures';\nSELECT create_hypertable('balance_snapshots', 'timestamp', if_not_exists => TRUE);\n\nCREATE TABLE IF NOT EXISTS trade_decisions (\n  id SERIAL,\n  timestamp TIMESTAMPTZ NOT NULL,\n  symbol TEXT NOT NULL,\n  decision TEXT NOT NULL,\n  reason TEXT,\n  regime TEXT,\n  adx NUMERIC(8,2),\n  atr NUMERIC(16,8),\n  rsi NUMERIC(8,2),\n  price NUMERIC(16,8),\n  balance_usdt NUMERIC(16,8),\n  exchange TEXT DEFAULT 'futures'\n);\nALTER TABLE trade_decisions ADD COLUMN IF NOT EXISTS exchange TEXT DEFAULT 'futures';\nSELECT create_hypertable('trade_decisions', 'timestamp', if_not_exists => TRUE);\n"

pairs:
  - name: ETH/USDT:USDT
    enabled: true
  - name: BTC/USDT:USDT
    enabled: true
  - name: SOL/USDT:USDT
    enabled: true
  - name: BNB/USDT:USDT
    enabled: true
  - name: XRP/USDT:USDT
    enabled: true
  - name: DOGE/USDT:USDT
    enabled: true
  - name: ADA/USDT:USDT
    enabled: true
  - name: AVAX/USDT:USDT
    enabled: true
  - name: DOT/USDT:USDT
    enabled: true
  - name: LINK/USDT:USDT
    enabled: true

strategy:
  entry:
    timeframe: 5m
    bollinger:
      period: 20
      std_dev: 2
    ema_period: 200
  regime:
    adx_period: 14
    adx_trend_threshold: 20
    atr_vol_spike: 2.0
  trend:
    allow_breakout: false
    allow_short: true
    allow_long: false
    short_rsi_threshold: 40
    short_min_adx: 15
    short_signal_adx: 20
    short_breakout_adx: 18
    short_mr_rsi_threshold: 65
    auto_tune:
      enabled: false
    ema_fast: 20
    ema_slow: 50
    rsi_oversold: 35
    rsi_overbought: 65
    risk_percent: 1.0
    tp_atr: 3.0
    trail_atr: 1.5
    profit_lock_pct: 0.30
    profit_lock_trail: 0.15
  exit:
    stop_loss:
      atr_multiplier: 3.0
      percent_below_lowest_grid: 3.0
    trend_inversion:
      timeframe: 1h
      ema_period: 200
  rebalance_interval_hours: 24

risk:
  slippage_max_percent: 0.05
  max_daily_loss_percent: 15
  max_daily_profit_pct: 0     # 0=disabled. Stop new entries when daily PnL >= this % of sim balance
  max_daily_profit_usd: 0     # $ target (overrides pct if > 0). Set via dashboard/Telegram.
  emergency_stop_pct: 5
  min_balance_per_pair: 20
  dust_cleaner_interval_days: 7
  safety_cap: 100
  max_trades_before_live: 50

notifications:
  telegram:
    token: ''
    chat_id: ''

trading_mode: technical_only
