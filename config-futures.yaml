profiles:
  sideway:
    grid:
      enabled: true
      type: geometric
      default_width_percent: 1.5
      default_count: 8
      default_equity_percent_per_level: 1.0
      profile_max_levels: 8
    strategy:
      entry:
        timeframe: 15m
        ema_period: 50
        bb_threshold: 0.005
        rsi_oversold: 30
        rsi_overbought: 70
      regime:
        adx_period: 14
        adx_trend_threshold: 20
        atr_vol_spike: 2.0
      trend:
        allow_breakout: false
        allow_short: true
        short_rsi_threshold: 65
        ema_fast: 20
        ema_slow: 50
        rsi_oversold: 35
        rsi_overbought: 65
        risk_percent: 1.0
        tp_atr: 1.0
        trail_atr: 1.0
      exit:
        stop_loss:
          percent_below_lowest_grid: 3.0
          atr_multiplier: 1.5
      breakeven_pct: 0.2
    risk:
      slippage_max_percent: 0.05
      min_net_profit_percent: 0.25

fees:
  maker: 0.0002
  taker: 0.0004

futures:
  leverage: 3
  margin_mode: isolated
  pairs:
    - BTC/USDT:USDT
    - ETH/USDT:USDT
    - SOL/USDT:USDT
    - DOGE/USDT:USDT
    - ADA/USDT:USDT
  budget_per_slot: 10
  max_slots: 5

exchange:
  name: binanceusdm
  api_key: ''
  api_secret: ''
  testnet: true
  rate_limit:
    max_requests: 1200
    interval: 60

grid:
  enabled: false

allocator:
  reserve_pct: 0.2
  min_per_slot: 10
  max_budget_pct: 0.6

execution:
  post_only_trend: true
  post_only_grid: true
  force_market_entries: false
  cancel_bot_orders_on_start: true
  sweep_on_start: false
  timeout:
    continuation: 90
    breakout: 300
    countertrend: 600
    sideway: 120

anti_churn:
  continuation:
    max_consecutive_losses: 2
    cooldown_minutes: 45

entry_paths: {}

pairs:
  - name: BTC/USDT
    enabled: true
    grid:
      width_percent: 1.5
      count: 8
  - name: ETH/USDT
    enabled: true
    grid:
      width_percent: 1.5
      count: 8
  - name: SOL/USDT
    enabled: true
    grid:
      width_percent: 1.5
      count: 8
  - name: DOGE/USDT
    enabled: true
    grid:
      width_percent: 1.5
      count: 8
  - name: ADA/USDT
    enabled: true
    grid:
      width_percent: 1.5
      count: 8

strategy:
  entry:
    timeframe: 15m
    bollinger:
      period: 20
      std_dev: 2
    ema_period: 200
  regime:
    adx_period: 14
    adx_trend_threshold: 20
    atr_vol_spike: 2.0
  trend:
    allow_breakout: false
    ema_fast: 20
    ema_slow: 50
    rsi_oversold: 35
    rsi_overbought: 65
    risk_percent: 2.0
    tp_atr: 2.0
    trail_atr: 1.5
  exit:
    take_profit:
      bollinger:
        period: 20
        std_dev: 2
    stop_loss:
      percent_below_lowest_grid: 3.0
    trend_inversion:
      timeframe: 1h
      ema_period: 200
  rebalance_interval_hours: 24

risk:
  slippage_max_percent: 0.05
  max_daily_loss_percent: 30
  emergency_stop_pct: 3
  min_balance_per_pair: 10
  dust_cleaner_interval_days: 7
  safety_cap: 100
  max_trades_before_live: 50

trading_mode: technical_only
