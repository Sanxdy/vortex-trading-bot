timescaledb:
  host: "localhost"
  port: 5432
  dbname: "vortex_trades"
  user: "vortex"
  password: ""
  schema: |
    CREATE TABLE IF NOT EXISTS trades (
      id SERIAL,
      timestamp TIMESTAMPTZ NOT NULL,
      pair TEXT NOT NULL,
      side TEXT NOT NULL,
      price NUMERIC(16,8) NOT NULL,
      quantity NUMERIC(16,8) NOT NULL,
      order_id TEXT,
      status TEXT NOT NULL,
      grid_level INTEGER,
      realized_pnl NUMERIC(16,8),
      fee_cost NUMERIC(16,8)
    );
    ALTER TABLE trades ADD COLUMN IF NOT EXISTS fee_cost NUMERIC(16,8);
    ALTER TABLE trades DROP CONSTRAINT IF EXISTS trades_pkey;
    ALTER TABLE trades DROP CONSTRAINT IF EXISTS trades_order_id_key;
    ALTER TABLE trades ADD CONSTRAINT trades_pkey PRIMARY KEY (timestamp, id);
    CREATE UNIQUE INDEX IF NOT EXISTS trades_timestamp_order_id_key ON trades (timestamp, order_id) WHERE order_id IS NOT NULL;
    SELECT create_hypertable('trades', 'timestamp', if_not_exists => TRUE);

    CREATE TABLE IF NOT EXISTS balance_snapshots (
      id SERIAL,
      timestamp TIMESTAMPTZ NOT NULL,
      usdt_balance NUMERIC(16,8),
      total_value NUMERIC(16,8)
    );
    SELECT create_hypertable('balance_snapshots', 'timestamp', if_not_exists => TRUE);

    CREATE TABLE IF NOT EXISTS trade_decisions (
      id SERIAL,
      timestamp TIMESTAMPTZ NOT NULL,
      symbol TEXT NOT NULL,
      decision TEXT NOT NULL,
      reason TEXT,
      regime TEXT,
      adx NUMERIC(8,2),
      atr NUMERIC(16,8),
      rsi NUMERIC(8,2),
      price NUMERIC(16,8),
      balance_usdt NUMERIC(16,8)
    );
    SELECT create_hypertable('trade_decisions', 'timestamp', if_not_exists => TRUE);
