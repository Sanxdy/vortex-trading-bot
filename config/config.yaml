  schema: "CREATE TABLE IF NOT EXISTS trades (\n  id SERIAL,\n  timestamp TIMESTAMPTZ NOT NULL,\n  pair TEXT NOT NULL,\n  side TEXT NOT NULL,\n  price NUMERIC(16,8) NOT NULL,\n  quantity NUMERIC(16,8) NOT NULL,\n  order_id TEXT,\n  status TEXT NOT NULL,\n  grid_level INTEGER,\n  realized_pnl NUMERIC(16,8),\n  fee_cost NUMERIC(16,8),\n  exchange TEXT DEFAULT 'spot'\n);\nALTER TABLE trades ADD COLUMN IF NOT EXISTS fee_cost NUMERIC(16,8);\nALTER TABLE trades ADD COLUMN IF NOT EXISTS exchange TEXT DEFAULT 'spot';\nALTER TABLE trades DROP CONSTRAINT IF EXISTS trades_pkey;\nALTER TABLE trades DROP CONSTRAINT IF EXISTS trades_order_id_key;\nALTER TABLE trades ADD CONSTRAINT trades_pkey PRIMARY KEY (timestamp, id);\nCREATE UNIQUE INDEX IF NOT EXISTS trades_timestamp_order_id_key ON trades (timestamp, order_id) WHERE order_id IS NOT NULL;\nSELECT create_hypertable('trades', 'timestamp', if_not_exists => TRUE);\n\nCREATE TABLE IF NOT EXISTS balance_snapshots (\n  id SERIAL,\n  timestamp TIMESTAMPTZ NOT NULL,\n  usdt_balance NUMERIC(16,8),\n  total_value NUMERIC(16,8),\n  exchange TEXT DEFAULT 'spot'\n);\nALTER TABLE balance_snapshots ADD COLUMN IF NOT EXISTS exchange TEXT DEFAULT 'spot';\nSELECT create_hypertable('balance_snapshots', 'timestamp', if_not_exists => TRUE);\n\nCREATE TABLE IF NOT EXISTS trade_decisions (\n  id SERIAL,\n  timestamp TIMESTAMPTZ NOT NULL,\n  symbol TEXT NOT NULL,\n  decision TEXT NOT NULL,\n  reason TEXT,\n  regime TEXT,\n  adx NUMERIC(8,2),\n  atr NUMERIC(16,8),\n  rsi NUMERIC(8,2),\n  price NUMERIC(16,8),\n  balance_usdt NUMERIC(16,8),\n  exchange TEXT DEFAULT 'spot'\n);\nALTER TABLE trade_decisions ADD COLUMN IF NOT EXISTS exchange TEXT DEFAULT 'spot';\nSELECT create_hypertable('trade_decisions', 'timestamp', if_not_exists => TRUE);\n"
