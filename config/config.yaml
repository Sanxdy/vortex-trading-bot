grid:
  type: "geometric"
  default_width_percent: 1.5
  default_count: 20
  default_equity_percent_per_level: 1.0

strategy:
  entry:
    timeframe: "15m"
    bollinger:
      period: 20
      std_dev: 2
    ema_period: 200
  regime:
    adx_period: 14
    adx_trend_threshold: 20
    atr_vol_spike: 2.0
  trend:
    ema_fast: 20
    ema_slow: 50
    rsi_oversold: 40
    rsi_overbought: 60
    risk_percent: 2.0
    tp_atr: 1.5
    trail_atr: 2.0
  exit:
    take_profit:
      bollinger:
        period: 20
        std_dev: 2
    stop_loss:
      percent_below_lowest_grid: 3.0
    trend_inversion:
      timeframe: "1h"
      ema_period: 200
  rebalance_interval_hours: 24

risk:
  slippage_max_percent: 0.05
  max_daily_loss_percent: 5
  min_balance_per_pair: 50
  dust_cleaner_interval_days: 7
  safety_cap: 500
  max_trades_before_live: 100

