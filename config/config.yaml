profiles:
  standard:
    description: "Swing: 1.5% geometric, 20 levels, 15m"
    grid:
      type: "geometric"
      default_width_percent: 1.5
      default_count: 20
      default_equity_percent_per_level: 1.0
    strategy:
      entry:
        timeframe: "15m"
        ema_period: 200
        bb_threshold: 0.001
      regime:
        adx_period: 14
        adx_trend_threshold: 20
        atr_vol_spike: 2.0
      trend:
        ema_fast: 20
        ema_slow: 50
        rsi_oversold: 40
        rsi_overbought: 60
        risk_percent: 2.0
        tp_atr: 1.5
        trail_atr: 2.0
      exit:
        stop_loss:
          percent_below_lowest_grid: 3.0
          atr_multiplier: 1.5
    risk:
      slippage_max_percent: 0.05
  scalper:
    description: "Scalp: 0.4% arithmetic, 4 levels (2B/2S), 5m"
    grid:
      type: "arithmetic"
      default_width_percent: 0.4
      default_count: 4
      default_equity_percent_per_level: 0.6
    strategy:
      entry:
        timeframe: "5m"
        ema_period: 50
        rsi_oversold: 35
        bb_threshold: 0.005
      regime:
        adx_period: 14
        adx_trend_threshold: 20
        atr_vol_spike: 2.0
      trend:
        ema_fast: 20
        ema_slow: 50
        rsi_oversold: 40
        rsi_overbought: 60
        risk_percent: 2.0
        tp_atr: 1.5
        trail_atr: 2.0
      exit:
        stop_loss:
          percent_below_lowest_grid: 2.5
          atr_multiplier: 1.5
    risk:
      slippage_max_percent: 0.05
      min_net_profit_percent: 0.1
  trend_only:
    description: "Trend-only: no grid, 15m, pullback entries only"
    grid:
      type: "arithmetic"
      default_width_percent: 0.4
      default_count: 1
      default_equity_percent_per_level: 5.0
    strategy:
      entry:
        timeframe: "15m"
        ema_period: 200
        bb_threshold: 0.001
      regime:
        adx_period: 14
        adx_trend_threshold: 20
        atr_vol_spike: 2.0
      trend:
        ema_fast: 20
        ema_slow: 50
        rsi_oversold: 40
        rsi_overbought: 60
        risk_percent: 3.0
        tp_atr: 2.0
        trail_atr: 2.5
      exit:
        stop_loss:
          percent_below_lowest_grid: 3.0
          atr_multiplier: 1.5
    risk:
      slippage_max_percent: 0.05
  conservative:
    description: "Conservative: 2% geometric, lower risk, 15m"
    grid:
      type: "geometric"
      default_width_percent: 2.0
      default_count: 15
      default_equity_percent_per_level: 0.5
    strategy:
      entry:
        timeframe: "15m"
        ema_period: 200
        bb_threshold: 0.001
      regime:
        adx_period: 14
        adx_trend_threshold: 20
        atr_vol_spike: 2.0
      trend:
        ema_fast: 20
        ema_slow: 50
        rsi_oversold: 35
        rsi_overbought: 65
        risk_percent: 1.0
        tp_atr: 1.0
        trail_atr: 1.5
      exit:
        stop_loss:
          percent_below_lowest_grid: 4.0
          atr_multiplier: 2.0
    risk:
      slippage_max_percent: 0.05

