profiles:
  standard:
    description: 'Swing: 1.5% geometric, 20 levels, 15m'
    grid:
      enabled: true
      type: geometric
      default_width_percent: 1.5
      default_count: 20
      default_equity_percent_per_level: 1.0
      profile_max_levels: 50
    strategy:
      entry:
        timeframe: 15m
        ema_period: 200
        bb_threshold: 0.001
      regime:
        adx_period: 14
        adx_trend_threshold: 20
        atr_vol_spike: 2.0
      trend:
        allow_breakout: true
        ema_fast: 20
        ema_slow: 50
        rsi_oversold: 40
        rsi_overbought: 60
        risk_percent: 2.0
        tp_atr: 2.0
        trail_atr: 1.5
        profit_lock_pct: 0.30
        profit_lock_trail: 0.15
      breakeven_pct: 0.20
      exit:
        stop_loss:
          percent_below_lowest_grid: 3.0
          atr_multiplier: 1.5

  scalper:
    description: 'Scalp: 1.2% arithmetic, 6 levels (3B/3S), 5m'
    grid:
      enabled: false
      type: arithmetic
      default_width_percent: 1.2
      default_count: 6
      default_equity_percent_per_level: 1.5
      profile_max_levels: 12
    strategy:
      entry:
        timeframe: 5m
        ema_period: 50
        rsi_oversold: 35
        bb_threshold: 0.005
      regime:
        adx_period: 14
        adx_trend_threshold: 30
        atr_vol_spike: 2.0
      trend:
        allow_breakout: true
        ema_fast: 20
        ema_slow: 50
        rsi_oversold: 40
        rsi_overbought: 60
        risk_percent: 1.5
        tp_atr: 2.0
        trail_atr: 1.5
        profit_lock_pct: 0.30
        profit_lock_trail: 0.15
      breakeven_pct: 0.18
      exit:
        stop_loss:
          percent_below_lowest_grid: 2.5
          atr_multiplier: 1.5
    risk:
      slippage_max_percent: 0.05
      min_net_profit_percent: 0.25
  trend_only:
    description: 'Trend only: continuation + pullback with AI, no grid'
    grid:
      enabled: false
      type: arithmetic
      default_width_percent: 0.6
      default_count: 5
      default_equity_percent_per_level: 1.0
      profile_max_levels: 5
    strategy:
      entry:
        timeframe: 15m
        ema_period: 200
        bb_threshold: 0.001
      regime:
        adx_period: 14
        adx_trend_threshold: 20
        atr_vol_spike: 2.0
      trend:
        allow_breakout: false
        ema_fast: 20
        ema_slow: 50
        rsi_oversold: 40
        rsi_overbought: 60
        risk_percent: 3.0
        tp_atr: 1.0
        trail_atr: 2.5
        profit_lock_pct: 0.30
        profit_lock_trail: 0.15
      breakeven_pct: 0.30
      exit:
        stop_loss:
          percent_below_lowest_grid: 3.0
          atr_multiplier: 1.5
    risk:
      slippage_max_percent: 0.05
      min_net_profit_percent: 0.25
  conservative:
    description: 'Conservative: 2% geometric, lower risk, 15m'
    grid:
      type: geometric
      default_width_percent: 2.0
      default_count: 15
      default_equity_percent_per_level: 0.5
      profile_max_levels: 30
    strategy:
      entry:
        timeframe: 15m
        ema_period: 200
        bb_threshold: 0.001
      regime:
        adx_period: 14
        adx_trend_threshold: 20
        atr_vol_spike: 2.0
      trend:
        allow_breakout: false
        ema_fast: 20
        ema_slow: 50
        rsi_oversold: 35
        rsi_overbought: 65
        risk_percent: 1.0
        tp_atr: 1.5
        trail_atr: 1.0
        profit_lock_pct: 0.30
        profit_lock_trail: 0.15
      breakeven_pct: 0.20
      exit:
        stop_loss:
          percent_below_lowest_grid: 4.0
          atr_multiplier: 2.0
    risk:
      slippage_max_percent: 0.05
      min_net_profit_percent: 0.25
  sideway:
    description: 'Sideway strategies: 4h, BB squeeze (19 altcoins) + trend_bounce (all pairs)'
    grid:
      type: geometric
      default_width_percent: 2.0
      default_count: 8
      default_equity_percent_per_level: 1.0
      profile_max_levels: 8
    strategy:
      entry:
        timeframe: 4h
        ema_period: 50
        bb_threshold: 0.005
      regime:
        adx_period: 14
        adx_trend_threshold: 20
        atr_vol_spike: 2.0
      trend:
        allow_breakout: false
        ema_fast: 20
        ema_slow: 50
        rsi_oversold: 35
        rsi_overbought: 65
        risk_percent: 1.0
        tp_atr: 1.0
        trail_atr: 1.0
      breakeven_pct: 0.20
      exit:
        stop_loss:
          percent_below_lowest_grid: 3.0
          atr_multiplier: 1.5
    risk:
      slippage_max_percent: 0.05
      min_net_profit_percent: 0.25
performance_guard:
  enabled: true
  lookback_days: 30
  min_trades: 20
  top_n_pairs: 8
  min_win_rate: 0.35  # raised from 0.18 — pairs below 35% WR are auto-paused
  min_net_pnl: -2.0   # raised tolerance slightly to avoid over-pausing new pairs
  pause_hours: 24
  cache_seconds: 900
fees:
  maker: 0.001
  taker: 0.001
allocator:
  reserve_pct: 0.2
  min_per_slot: 35
  max_budget_pct: 0.6
execution:
  client_order_id_prefix: vx
  manage_only_bot_orders: true
  post_only_grid: true
  post_only_trend: true   # PHASE1: maker-only — was false (taker). Cuts fee drag from 68%
  force_market_entries: false  # PHASE1: was true — was overriding post_only and causing taker fees
  cancel_bot_orders_on_start: true
  sweep_on_start: false
  timeout:
    continuation: 180   # PHASE1: doubled from 90s — reduces 53.9% cancel rate
    breakout: 300       # PHASE1: tripled from 90s — gives limit orders time to fill
    countertrend: 300
    sideways: 600
  offset:
    continuation: 0.0003
    breakout: 0.0003
    countertrend: 0.0
    sideways: 0.0
  max_spread_pct: 0.0015
anti_churn:
  continuation:
    max_consecutive_losses: 2
    cooldown_minutes: 45
auto_profile:
  enabled: true
  interval_seconds: 1800
  min_hold_seconds: 7200
  switch_only_when_flat: true
simulation:
  reset_on_start: false
  reset_on_change: true
  reset_on_disable: false
