version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: vortex_password
      POSTGRES_USER: vortex
      POSTGRES_DB: vortex_trades
    volumes:
      - timescale_data:/var/lib/postgresql/data

  vortex-bot:
    build: .
    depends_on:
      - redis
      - timescaledb
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TIMESCALE_DB_HOST=timescaledb
      - TIMESCALE_DB_PORT=5432
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./.env:/app/.env
    command: python -m src.main

volumes:
  redis_data:
  timescale_data:
