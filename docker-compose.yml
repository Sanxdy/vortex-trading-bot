services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 256m
    memswap_limit: 512m

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: vortex_password
      POSTGRES_USER: vortex
      POSTGRES_DB: vortex_trades
    volumes:
      - timescale_data:/var/lib/postgresql/data
    mem_limit: 512m
    memswap_limit: 1g

  vortex-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      timescaledb:
        condition: service_started
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TIMESCALE_DB_HOST=timescaledb
      - TIMESCALE_DB_PORT=5432
      - TIMESCALE_DB_NAME=vortex_trades
      - TIMESCALE_DB_USER=vortex
      - TIMESCALE_DB_PASSWORD=vortex_password
      - NINEROUTER_URL=http://9router:20128/v1
      - NINEROUTER_KEY=${NINEROUTER_KEY:-}
    extra_hosts:
      - "api.binance.com:18.64.21.130"
    volumes:
      - ./src:/app/src
      - ./backtest:/app/backtest
      - ./config:/app/config
      - ./.env:/app/.env
      - ./data:/app/data
      - /mnt/usb/backtest_cache:/app/data/backtest_cache
    command: python -m src.main
    mem_limit: 256m
    memswap_limit: 512m

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dash
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      timescaledb:
        condition: service_started
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TIMESCALE_DB_HOST=timescaledb
      - TIMESCALE_DB_PORT=5432
      - TIMESCALE_DB_NAME=vortex_trades
      - TIMESCALE_DB_USER=vortex
      - TIMESCALE_DB_PASSWORD=vortex_password
    volumes:
      - ./dashboard:/app/dashboard
      - ./config:/app/config
      - ./.env:/app/.env
      - ./data:/app/data
      - /mnt/usb/backtest_cache:/app/data/backtest_cache
    command: python -m dashboard.app
    mem_limit: 256m
    memswap_limit: 512m

  vortex-futures-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      timescaledb:
        condition: service_started
    env_file: .env.futures
    extra_hosts:
      - "api.binance.com:18.64.21.130"
      - "demo-fapi.binance.com:18.178.46.7"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TIMESCALE_DB_HOST=timescaledb
      - TIMESCALE_DB_PORT=5432
      - TIMESCALE_DB_NAME=vortex_trades
      - TIMESCALE_DB_USER=vortex
      - TIMESCALE_DB_PASSWORD=vortex_password
      - NINEROUTER_URL=http://9router:20128/v1
      - NINEROUTER_KEY=${NINEROUTER_KEY:-}
    volumes:
      - ./config-futures.yaml:/app/config-futures.yaml
      - ./src:/app/src
      - ./backtest:/app/backtest
      - ./.env.futures:/app/.env
      - ./data:/app/data
    command: python -m src.main_futures
    mem_limit: 256m
    memswap_limit: 512m

  9router:
    image: decolua/9router:latest
    restart: unless-stopped
    ports:
      - "20128:20128"
    volumes:
      - .9router_data:/app/data
    environment:
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_URL=http://localhost:20128
    mem_limit: 256m
    memswap_limit: 512m

volumes:
  redis_data:
  timescale_data:
  9router_data:
