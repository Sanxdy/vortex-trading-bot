services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: vortex_password
      POSTGRES_USER: vortex
      POSTGRES_DB: vortex_trades
    volumes:
      - timescale_data:/var/lib/postgresql/data

  vortex-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      timescaledb:
        condition: service_started
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TIMESCALE_DB_HOST=timescaledb
      - TIMESCALE_DB_PORT=5432
      - TIMESCALE_DB_NAME=vortex_trades
      - TIMESCALE_DB_USER=vortex
      - TIMESCALE_DB_PASSWORD=vortex_password
    volumes:
      - ./src:/app/src
      - ./backtest:/app/backtest
      - ./config:/app/config
      - ./.env:/app/.env
      - ./data:/app/data
      - /mnt/usb/backtest_cache:/app/data/backtest_cache
    command: python -m src.main

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dash
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      timescaledb:
        condition: service_started
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TIMESCALE_DB_HOST=timescaledb
      - TIMESCALE_DB_PORT=5432
      - TIMESCALE_DB_NAME=vortex_trades
      - TIMESCALE_DB_USER=vortex
      - TIMESCALE_DB_PASSWORD=vortex_password
    volumes:
      - ./dashboard:/app/dashboard
      - ./config:/app/config
      - ./.env:/app/.env
      - ./data:/app/data
      - /mnt/usb/backtest_cache:/app/data/backtest_cache
    command: python -m dashboard.app

  vortex-futures-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      timescaledb:
        condition: service_started
    env_file: .env.futures
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TIMESCALE_DB_HOST=timescaledb
      - TIMESCALE_DB_PORT=5432
      - TIMESCALE_DB_NAME=vortex_trades
      - TIMESCALE_DB_USER=vortex
      - TIMESCALE_DB_PASSWORD=vortex_password
    volumes:
      - ./config-futures.yaml:/app/config-futures.yaml
      - ./src:/app/src
      - ./backtest:/app/backtest
      - ./.env.futures:/app/.env
      - ./data:/app/data
    command: python -m src.main_futures

volumes:
  redis_data:
  timescale_data:
